
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  interval: 15m
  chart:
    spec:
      chart: nextcloud
      version: 50.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    nextcloud:
      credentials:
        initialAdminUser: "${NEXTCLOUD_USER}"
        initialAdminPassword: "${NEXTCLOUD_PASSWORD}"
      general:
        run_optimize: true
        default_phone_region: NL
        accessIP: "${NGINX_EXTERNAL_IP}"
      php:
        memory_limit: 5G
        upload_limit: 60G
        pm_max_children: 32

    TZ: Europe/Amsterdam

    credentials:
      cloudflare:
        type: s3
        url: "${CF_URL}"
        bucket: "backups"
        accessKey: "${CF_ACCESSKEY}"
        secretKey: "${CF_SECRETKEY}"
        encrKey: "${CF_SECRETKEY}"
      minio:
        type: s3
        url: "${S3URL}"
        bucket: "${S3PREFIX}-nextcloud"
        accessKey: "${MINIO_ACCESSKEY}"
        secretKey: "${MINIO_SECRETKEY}"
        encrKey: "${MINIO_SECRETKEY}"

    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: prod-dl
        hosts:
          - host: cloud.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix

    persistence:
      html:
        volsync:
          - name: html-config
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true
              cacheCapacity: 20Gi
              trigger:
                schedule: "45 1 * * *"

      config:
        volsync:
          - name: config
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true
              cacheCapacity: 20Gi
              trigger:
                schedule: "45 1 * * *"

      data:
        enabled: true
        path: /mnt/TANK/cloud-dutchlincoln
        server: 10.16.61.10
        type: nfs
        mountOptions:
          - key: nfsvers
            value: "4"
          - key: tcp
          - key: intr
          - key: hard
          - key: noatime
          - key: nodiratime
          - key: nolock

    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          # pgVersion: 16
          mode: recovery
          recovery:
            method: object_store
            credentials: minio
          backups:
            enabled: true
            credentials: minio
            revision: "1"

    podOptions:
      hostUsers: true

    workload:
      main:
        podSpec:
          containers:
            main:
              resources:
                requests:
                  memory: 2Gi
                limits:
                  memory: 6Gi

