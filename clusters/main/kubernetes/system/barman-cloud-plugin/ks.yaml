apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud-plugin
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager
  interval: 10m
  path: clusters/main/kubernetes/system/barman-cloud-plugin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster